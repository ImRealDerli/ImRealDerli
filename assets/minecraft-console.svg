<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; font-weight: 500; }
    .code { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; font-size: 12.5px; }
    .time { fill: #8b949e; }
    .info { fill: #58a6ff; font-weight: bold; }
    .prefix { fill: #3fb950; font-weight: bold; }
    .accent { fill: #d2a8ff; font-weight: 600; }
    .highlight { fill: #ffa657; font-weight: 600; }
    .success { fill: #3fb950; font-weight: bold; }
    .text { fill: #c9d1d9; }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1s infinite;
      fill: #58a6ff;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="718" height="218" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Terminal Top Bar -->
  <path d="M 1 11 C 1 5.5 5.5 1 11 1 L 709 1 C 714.5 1 719 5.5 719 11 L 719 32 L 1 32 Z" fill="#21262d"/>
  <circle cx="18" cy="16" r="5.5" fill="#ff5f56"/>
  <circle cx="36" cy="16" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="16" r="5.5" fill="#27c93f"/>
  <text x="360" y="21" text-anchor="middle" class="terminal-header">server@paper-mc: ~ /plugins/ImRealDerli</text>

  <!-- Console Log Content -->
  <g class="code" transform="translate(18, 55)">
    <!-- Line 1 -->
    <text y="0">
      <tspan class="time">[12:00:01] </tspan>
      <tspan class="info">[INFO] </tspan>
      <tspan class="text">Loading plugins for </tspan>
      <tspan class="prefix">Paper 1.21.x / Folia / Purpur</tspan>
      <tspan class="text">...</tspan>
    </text>

    <!-- Line 2 -->
    <text y="24">
      <tspan class="time">[12:00:01] </tspan>
      <tspan class="info">[INFO] </tspan>
      <tspan class="prefix">[DRplugins] </tspan>
      <tspan class="text">Runtime: </tspan>
      <tspan class="accent">Java 21</tspan>
      <tspan class="text"> | Build: </tspan>
      <tspan class="accent">Gradle &amp; Maven</tspan>
    </text>

    <!-- Line 3 -->
    <text y="48">
      <tspan class="time">[12:00:02] </tspan>
      <tspan class="info">[INFO] </tspan>
      <tspan class="prefix">[DRplugins] </tspan>
      <tspan class="text">Connecting HikariCP pool to </tspan>
      <tspan class="highlight">MySQL / SQLite</tspan>
      <tspan class="text">... </tspan>
      <tspan class="success">Connected!</tspan>
    </text>

    <!-- Line 4 -->
    <text y="72">
      <tspan class="time">[12:00:02] </tspan>
      <tspan class="info">[INFO] </tspan>
      <tspan class="prefix">[DRplugins] </tspan>
      <tspan class="text">Modules initialized: </tspan>
      <tspan class="accent">Core, Auction, Clans, Auth, Economy, Spawners</tspan>
    </text>

    <!-- Line 5 -->
    <text y="96">
      <tspan class="time">[12:00:03] </tspan>
      <tspan class="info">[INFO] </tspan>
      <tspan class="prefix">[DRplugins] </tspan>
      <tspan class="success">✔ All systems loaded successfully (0.421s) • 20.0 TPS</tspan>
    </text>

    <!-- Line 6 (Command Prompt + Cursor) -->
    <text y="122">
      <tspan class="prefix">&gt; </tspan>
      <tspan class="text">drplugins status --performance --tps</tspan>
      <rect x="298" y="-11" width="8" height="14" class="cursor"/>
    </text>
  </g>
</svg>
