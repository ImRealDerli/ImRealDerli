<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <!-- Pixelated / Retro Minecraft Font Simulation -->
    <style>
      .mc-title { font-family: "Minecraft", "Courier New", monospace; font-size: 13px; font-weight: bold; fill: #ffd700; text-shadow: 2px 2px #3f3600; }
      .mc-desc { font-family: "Minecraft", "Courier New", monospace; font-size: 15px; font-weight: bold; fill: #ffffff; text-shadow: 2px 2px #222222; }
    </style>
    <filter id="dropshadow" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Toast -->
  <rect x="3" y="3" width="334" height="64" rx="4" fill="#212121" stroke="#5a5a5a" stroke-width="2" filter="url(#dropshadow)"/>
  <rect x="5" y="5" width="330" height="60" rx="3" fill="#2a2a2a" stroke="#111111" stroke-width="1.5"/>

  <!-- Icon Frame (Minecraft Achievement Box) -->
  <rect x="14" y="13" width="44" height="44" rx="3" fill="#1e1e1e" stroke="#8b8b8b" stroke-width="2"/>
  <rect x="16" y="15" width="40" height="40" rx="2" fill="#3a3a3a"/>

  <!-- Diamond Sword Vector Icon -->
  <g transform="translate(18, 17) scale(1.1)">
    <!-- Blade -->
    <polygon points="26,4 30,8 14,24 10,20" fill="#55ffff"/>
    <polygon points="28,2 32,6 16,22 12,18" fill="#00aaaa"/>
    <polygon points="24,6 28,10 12,26 8,22" fill="#55ffff"/>
    <!-- Guard -->
    <polygon points="9,21 13,25 11,27 7,23" fill="#555555"/>
    <polygon points="12,18 16,22 14,24 10,20" fill="#333333"/>
    <polygon points="6,24 10,28 8,30 4,26" fill="#333333"/>
    <!-- Hilt & Pommel -->
    <polygon points="7,27 10,30 5,35 2,32" fill="#855325"/>
    <polygon points="3,31 6,34 2,38 -1,35" fill="#553315"/>
  </g>

  <!-- Text -->
  <text x="70" y="31" class="mc-title">Advancement Made!</text>
  <text x="70" y="52" class="mc-desc">Minecraft Plugin Master</text>
</svg>
